<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f2e9"/>
      <stop offset="1" stop-color="#efe7d9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#171614" flood-opacity=".16"/>
    </filter>
    <style>
      .sans { font-family: "DejaVu Sans", sans-serif; }
      .serif { font-family: "DejaVu Serif", Georgia, serif; }
      .mono { font-family: "DejaVu Sans Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <circle cx="1080" cy="55" r="290" fill="#e8a33d" opacity=".14"/>
  <circle cx="40" cy="640" r="220" fill="#1d6868" opacity=".08"/>

  <g transform="translate(72 56)">
    <rect width="46" height="46" rx="13" fill="#171614"/>
    <path d="M10 15.6c4.2-2.5 8.3-2.5 12.5 0v17c-4.2-2.5-8.3-2.5-12.5 0V15.6Z" fill="#f4efe5"/>
    <path d="M22.5 15.6c4.2-2.5 8.3-2.5 12.5 0v17c-4.2-2.5-8.3-2.5-12.5 0V15.6Z" fill="#f4efe5" opacity=".72"/>
    <path d="M29 20v7M32.5 17.5v12" stroke="#e8a33d" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="32" class="serif" font-size="31" font-weight="700" letter-spacing="-1" fill="#171614">BookCast</text>
  </g>

  <text x="72" y="184" class="sans" font-size="15" font-weight="700" letter-spacing="4" fill="#a2611b">CHARACTER-AWARE AUDIOBOOKS</text>

  <text x="72" y="272" class="serif" font-size="82" letter-spacing="-3" fill="#171614">Your books,</text>
  <text x="72" y="358" class="serif" font-size="82" letter-spacing="-3" fill="#171614">performed by</text>
  <text x="72" y="444" class="serif" font-size="82" letter-spacing="-3" font-style="italic" fill="#a2611b">a full cast.</text>

  <text x="74" y="500" class="sans" font-size="21" fill="#6c6a61">EPUB + PDF → a narrator, a voice for every character,</text>
  <text x="74" y="532" class="sans" font-size="21" fill="#6c6a61">and a scene engine that follows who is speaking.</text>

  <g transform="translate(72 560)">
    <rect x="0" y="0" width="118" height="38" rx="19" fill="#171614"/>
    <circle cx="22" cy="19" r="10" fill="#f4efe5"/>
    <text x="20.5" y="23.5" class="sans" font-size="11" font-weight="700" fill="#171614">N</text>
    <text x="39" y="24" class="sans" font-size="13" font-weight="600" fill="#f4efe5">Narrator</text>

    <rect x="130" y="0" width="94" height="38" rx="19" fill="none" stroke="#171614" stroke-opacity=".18"/>
    <circle cx="152" cy="19" r="10" fill="#a2611b"/>
    <text x="150.5" y="23.5" class="sans" font-size="11" font-weight="700" fill="#fff">M</text>
    <text x="169" y="24" class="sans" font-size="13" font-weight="600" fill="#171614">Mara</text>

    <rect x="238" y="0" width="94" height="38" rx="19" fill="none" stroke="#171614" stroke-opacity=".18"/>
    <circle cx="260" cy="19" r="10" fill="#1d6868"/>
    <text x="258.5" y="23.5" class="sans" font-size="11" font-weight="700" fill="#fff">E</text>
    <text x="277" y="24" class="sans" font-size="13" font-weight="600" fill="#171614">Elias</text>

    <rect x="346" y="0" width="86" height="38" rx="19" fill="none" stroke="#171614" stroke-opacity=".18"/>
    <circle cx="368" cy="19" r="10" fill="#b14c41"/>
    <text x="366.5" y="23.5" class="sans" font-size="11" font-weight="700" fill="#fff">M</text>
    <text x="385" y="24" class="sans" font-size="13" font-weight="600" fill="#171614">Mom</text>
  </g>

  <g transform="translate(826 160) rotate(3)" filter="url(#shadow)">
    <rect width="308" height="324" rx="22" fill="#fffdf8" stroke="#171614" stroke-opacity=".18"/>
    <text x="26" y="42" class="sans" font-size="10" font-weight="700" letter-spacing="2.2" fill="#858176">NOW CASTING</text>
    <text x="26" y="76" class="serif" font-size="27" font-weight="700" letter-spacing="-.8" fill="#171614">The Last Platform</text>
    <rect x="26" y="96" width="256" height="1" fill="#171614" opacity=".12"/>

    <g transform="translate(26 116)">
      <rect width="256" height="42" rx="8" fill="#f4efe5"/>
      <rect x="0" y="0" width="4" height="42" rx="2" fill="#171614"/>
      <text x="16" y="17" class="sans" font-size="8" font-weight="700" letter-spacing="1.4" fill="#171614">NARRATOR</text>
      <text x="16" y="32" class="serif" font-size="12" fill="#171614">The station clock clicked over to 7:04.</text>
    </g>
    <g transform="translate(26 166)">
      <rect width="256" height="42" rx="8" fill="#fff" stroke="#171614" stroke-opacity=".1"/>
      <rect x="0" y="0" width="4" height="42" rx="2" fill="#a2611b"/>
      <text x="16" y="17" class="sans" font-size="8" font-weight="700" letter-spacing="1.4" fill="#a2611b">MOM</text>
      <text x="16" y="32" class="serif" font-size="12" fill="#171614">“You’re going to miss it.”</text>
    </g>
    <g transform="translate(26 216)">
      <rect width="256" height="42" rx="8" fill="#fff" stroke="#171614" stroke-opacity=".1"/>
      <rect x="0" y="0" width="4" height="42" rx="2" fill="#a2611b"/>
      <text x="16" y="17" class="sans" font-size="8" font-weight="700" letter-spacing="1.4" fill="#a2611b">MARA</text>
      <text x="16" y="32" class="serif" font-size="12" fill="#171614">“Then I’ll catch the next one.”</text>
    </g>
    <g transform="translate(26 266)">
      <rect width="256" height="42" rx="8" fill="#fff" stroke="#171614" stroke-opacity=".1"/>
      <rect x="0" y="0" width="4" height="42" rx="2" fill="#1d6868"/>
      <text x="16" y="17" class="sans" font-size="8" font-weight="700" letter-spacing="1.4" fill="#1d6868">ELIAS</text>
      <text x="16" y="32" class="serif" font-size="12" fill="#171614">“I’ll save you a seat.”</text>
    </g>

    <g transform="translate(26 318)">
      <text x="0" y="0" class="mono" font-size="8" fill="#858176">5 VOICES · SCENE-AWARE</text>
    </g>
  </g>

  <g transform="translate(866 92)" opacity=".65">
    <rect width="3" height="16" rx="1.5" fill="#171614"/>
    <rect x="8" y="-6" width="3" height="28" rx="1.5" fill="#171614"/>
    <rect x="16" y="-1" width="3" height="18" rx="1.5" fill="#171614"/>
    <rect x="24" y="-10" width="3" height="36" rx="1.5" fill="#a2611b"/>
    <rect x="32" y="-3" width="3" height="22" rx="1.5" fill="#171614"/>
  </g>
</svg>
